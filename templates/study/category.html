{% load static %}
<!DOCTYPE html>
<html><head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><title>{{ category.name }}</title></head>
<body>
<div class="container py-4">
<a href="{% url 'home' %}" class="btn btn-sm btn-light mb-3">← Back</a>
<h3>{{ category.name }} Materials</h3>
<p class="text-muted">{{ category.description }}</p>
<div class="row">
{% for mat in materials %}
<div class="col-md-4 mb-3"><div class="card"><div class="card-body">
<h6>{{ mat.title }}</h6>
<a href="{{ mat.get_url }}" class="btn btn-sm btn-primary">Open</a>
</div></div></div>
{% empty %}<p>No materials for {{ category.name }} yet.</p>{% endfor %}
</div>
</div>
</body></html>
