<!DOCTYPE html>
<html>
<head><title>Set New Password - YAZA</title>
<style>
  body{font-family:Arial;background:#f2f2f2;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
  .card{background:white;padding:30px;border-radius:12px;width:380px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
  h2{text-align:center}
  input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
  button{width:100%;padding:12px;background:#0d6efd;color:white;border:none;border-radius:8px;font-size:15px;cursor:pointer}
  ul{font-size:12px;color:#888}
</style>
</head>
<body>
<div class="card">
  <h2>Set New Password</h2>
  {% if validlink %}
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Change Password</button>
    </form>
  {% else %}
    <p>This link is expired or already used. Please request a new one.</p>
    <a href="{% url 'password_reset' %}">Request New Link</a>
  {% endif %}
</div>
</body>
</html>
