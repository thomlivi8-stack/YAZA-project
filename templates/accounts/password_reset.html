<!DOCTYPE html>
<html>
<head>
<title>Forgot Password - YAZA</title>
<style>
  body{font-family:Arial;background:#f2f2f2;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
  .card{background:white;padding:30px;border-radius:12px;width:360px;box-shadow:0 4px 20px rgba(0,0,0,0.1);text-align:center}
  h2{margin:0 0 10px;color:#222}
  p{color:#666;font-size:14px}
  input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
  button{width:100%;padding:12px;background:#0d6efd;color:white;border:none;border-radius:8px;font-size:15px;cursor:pointer}
  button:hover{background:#0b5ed7}
  a{color:#0d6efd;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h2>Forgot Password?</h2>
  <p>Enter the email you used to login, we will send you a reset link.</p>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send Reset Link</button>
  </form>
  <br>
  <a href="{% url 'login' %}">Back to Login</a>
</div>
</body>
</html>
