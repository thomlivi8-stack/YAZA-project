{% load static %}

{% block content %}

<div style="padding:20px;">
  <h2 style="margin-bottom:20px; text-transform:capitalize;">{{ category.name }}</h2>

  <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px;">
  {% for m in materials %}
    <a href="{{ m.get_url }}" style="text-decoration:none;">
      <div style="background:#143628; border-radius:15px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.2);">
        {% if m.thumbnail %}
          <img src="{{ m.thumbnail.url }}" style="width:100%; height:220px; object-fit:contain; background:white; display:block;">
        {% else %}
          <div style="background:white; height:220px; display:flex; align-items:center; justify-content:center; color:#333; font-weight:bold;">PDF</div>
        {% endif %}
        <div style="padding:12px 15px; color:white;">
          <div style="font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ m.title }}</div>
          <div style="font-size:13px; color:#b5d1c3; margin-top:3px;">{{ m.page_count }} pages • {{ m.file_size }} • PDF</div>
        </div>
      </div>
    </a>
  {% empty %}
    <p>No materials yet</p>
  {% endfor %}
  </div>
</div>
{% endblock %}
